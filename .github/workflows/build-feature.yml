name: build feature branches

on:
  push:
    branches-ignore:
      - master
      - 1.*
      - 2.*
  pull_request:

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest]

    runs-on: ${{ matrix.os }}
    steps:

      - name: free disk space
        continue-on-error: true
        run: |
          df -h
          sudo swapoff -a
          sudo rm -f /swapfile
          sudo apt clean
          if [ -n "$(docker image ls -q)" ]; then
            docker rmi -f $(docker image ls -aq) || true
          fi
          df -h

      - uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'
          cache-dependency-path: '**/pom.xml'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: Build with Maven
        run: ./mvnw -T 1C -B --no-transfer-progress verify -P coverage

      - name: Build documentation with Maven
        run: ./mvnw -T 1C -B --no-transfer-progress site

      - uses: codecov/codecov-action@v5
        with:
          files: "'*/jacoco.xml'"
